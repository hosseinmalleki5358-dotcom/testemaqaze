<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شهسواری | سیستم مدیریت تعویض روغنی و آپاراتی — اصلاح عملیاتی ۱۴۰۵/۰۸/۱۹</title>
<meta name="app-build" content="operational-safe-2026-11-10">
<meta name="description" content="سیستم مدیریت انبار، فاکتور، چک، حساب دفتری، هزینه‌ها و گزارش فروش تعویض روغنی و آپاراتی شهسواری — میدان ابوالفضل، بلوار خیرآباد">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141412; --surface:#1E1D19; --surface-2:#26251F; --line:#34322A; --line-soft:#2B2A24;
  --text:#F3EFE6; --muted:#A6A093;
  --yellow:#FFC400; --yellow-ink:#1A1602;
  --orange:#FF8A00; --red:#E23B2E;
  --r:14px; --r-sm:9px; --pill:999px;
  --f:'Vazirmatn',Tahoma,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:15px;line-height:1.7;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--yellow);text-decoration:none}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px;border-radius:4px}
::placeholder{color:#6d675c}
.num{font-feature-settings:"tnum";direction:ltr;unicode-bidi:embed}
.muted{color:var(--muted)}
.y{color:var(--yellow)} .o{color:var(--orange)} .r{color:var(--red)}

#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);transition:.25s}
.pin-dots span.on{background:var(--yellow);border-color:var(--yellow)}
.pin-dots.err span{border-color:var(--red);background:var(--red)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.keypad button{height:60px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:700;transition:.2s}
.keypad button:hover{background:var(--surface-2);border-color:var(--yellow)}
#loginErr{min-height:22px;font-size:13px;color:var(--red);max-width:90vw;text-align:center}
#dataRecoveryScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
#dataRecoveryScreen .recovery-card{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--red);border-radius:var(--r);padding:24px}
#dataRecoveryScreen h1{font-size:20px;margin-bottom:12px;color:var(--red)}
#dataRecoveryScreen p,#dataRecoveryScreen li{font-size:14px;color:var(--muted);line-height:1.9}
.login-hint{color:var(--muted);font-size:13px}

#appShell{display:none;min-height:100vh}
#appShell.on{display:block}
header.top{position:sticky;top:0;z-index:40;background:rgba(20,20,18,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:14px;padding:10px 18px}
#burger{display:flex;width:42px;height:42px;border-radius:var(--r-sm);border:1px solid var(--line);align-items:center;justify-content:center}
#burger svg{width:20px;height:20px;stroke:var(--text)}
.brand{display:flex;align-items:center;gap:10px}
.brand-name{font-weight:800;font-size:16px}
.brand-sub{font-size:12px;color:var(--yellow);font-weight:700}
#pageTitle{margin-inline-start:auto;font-size:14px;color:var(--muted);font-weight:500}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45}
#overlay.on{display:block}
aside#sidebar{position:fixed;top:0;bottom:0;right:0;width:264px;max-width:85vw;background:var(--surface);border-inline-start:1px solid var(--line-soft);z-index:50;padding:18px 12px;overflow-y:auto;transition:transform .3s ease;transform:translateX(100%);box-shadow:-12px 0 40px rgba(0,0,0,.5)}
aside#sidebar.open{transform:translateX(0)}
aside#sidebar .side-head{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 16px;border-bottom:1px solid var(--line-soft);margin-bottom:12px}
#sideClose{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:16px}
.nav-link{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:var(--r-sm);color:var(--muted);font-weight:500;font-size:14.5px;transition:.2s;margin-bottom:2px;text-align:right}
.nav-link svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav-link:hover{background:var(--surface-2);color:var(--text)}
.nav-link.on{background:var(--surface-2);color:var(--yellow);font-weight:700}
.nav-link .badge{margin-inline-start:auto;background:var(--orange);color:#1A0E00;font-size:11px;font-weight:800;border-radius:var(--pill);padding:1px 8px}
.nav-link.mgmt{color:var(--yellow);font-weight:700;border-top:1px solid var(--line-soft);margin-top:10px;padding-top:14px}
.nav-sub{display:none;padding-inline-start:8px;border-inline-start:2px solid var(--line);margin-inline-start:10px}
.nav-sub.open{display:block}
.nav-sub .nav-link{font-size:13.5px;padding:9px 10px}
.nav-sub .nav-link.lock{color:var(--red)}
main{padding:24px;max-width:1200px;margin:0 auto}
.page{display:none}
.page.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:900px){
  main{padding:16px 12px}
  #pageTitle{display:none}
}

#alarmBanner{display:none;background:#2A1B07;border:1px solid var(--orange);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;color:#FFD9A8;font-size:14px}
#alarmBanner.on{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#alarmBanner b{color:var(--orange)}
#alarmBanner button{margin-inline-start:auto;background:var(--orange);color:#1A0E00;font-weight:700;border-radius:var(--pill);padding:5px 14px;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px}
.card+.card{margin-top:16px}
.card h2{font-size:16px;font-weight:800;margin-bottom:14px}
.card h2 small{font-weight:500;color:var(--muted);font-size:12.5px;margin-inline-start:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px 18px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:800;margin-top:2px}
.stat.hl{border-color:var(--yellow)}
.stat.warn{border-color:var(--orange)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-sm);padding:10px 18px;font-weight:700;font-size:14px;transition:.25s;border:1px solid transparent}
.btn-y{background:var(--yellow);color:var(--yellow-ink)}
.btn-y:hover{background:#FFD34D}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btn-danger{background:transparent;border-color:#5a2620;color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.field{margin-bottom:14px;min-width:0}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.inp,select.inp,textarea.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;transition:.2s}
.inp:focus{border-color:var(--yellow);outline:none}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 49%,var(--muted) 50%),linear-gradient(-45deg,transparent 49%,var(--muted) 50%);background-position:left 14px center,left 8px center;background-size:6px 6px;background-repeat:no-repeat}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.row>*{flex:1 1 220px;min-width:0}
.row .btn{flex:none;min-width:0}
.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{background:var(--surface-2);text-align:right;padding:10px 12px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line-soft);white-space:nowrap}
tr:hover td{background:rgba(255,196,0,.03)}
.tag{display:inline-block;border-radius:var(--pill);padding:2px 10px;font-size:11.5px;font-weight:700;border:1px solid}
.tag-y{color:var(--yellow);border-color:#4d3d00;background:rgba(255,196,0,.08)}
.tag-o{color:var(--orange);border-color:#5a3400;background:rgba(255,138,0,.08)}
.tag-r{color:var(--red);border-color:#5a2620;background:rgba(226,59,46,.08)}
.tag-m{color:var(--muted);border-color:var(--line)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty svg{width:38px;height:38px;stroke:var(--line);fill:none;stroke-width:1.5;display:block;margin:0 auto 10px}
.search-box{position:relative}
.drop{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);z-index:30;max-height:260px;overflow-y:auto;display:none}
.drop.on{display:block}
.drop button{display:block;width:100%;text-align:right;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-size:13.5px}
.drop button:hover{background:var(--bg)}
.drop small{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);border-radius:var(--pill);padding:7px 16px;font-size:13px;color:var(--muted);font-weight:600;transition:.2s}
.tab.on{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}

.jal{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.jal select{flex:1 1 58px;min-width:0;text-align:center;padding:10px 4px}
.jal select.jm{flex:1.35 1 70px}
.jal .btn{flex:none;padding:8px 12px}

.rep-filter{display:grid;gap:12px;grid-template-columns:1fr 1fr auto;align-items:end}
.rep-filter .btn{margin-bottom:1px}
@media(max-width:760px){
  .rep-filter{grid-template-columns:1fr}
  .rep-filter .btn{grid-column:1/-1;width:100%}
}

.money-words{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px;font-weight:500}
.money-words:not(:empty){color:var(--yellow)}

.plate{display:flex;gap:5px;align-items:center;direction:ltr;width:100%}
.plate .inp{padding:10px 2px}
.plate .pa{width:48px;flex:none;text-align:center}
.plate .pl{width:64px;flex:none;text-align:center;direction:rtl}
.plate .pb{width:58px;flex:none;text-align:center}
.plate .pc{width:46px;flex:none;text-align:center}
.plate .pir{font-size:12px;font-weight:800;color:var(--muted);padding:0 3px;direction:rtl;white-space:nowrap}
.plate-tag{display:inline-flex;align-items:center;gap:6px;background:#f4f1e8;color:#111;border:1px solid #555;border-radius:6px;padding:1px 9px;font-weight:800;font-size:12.5px;direction:rtl;white-space:nowrap}
.pt-main{direction:ltr;display:inline-flex;gap:4px;align-items:center}
.pt-l{font-style:normal;background:#e8e4d8;border-radius:3px;padding:0 4px}
.pt-ir{color:#444}
@media(max-width:480px){.modal-body{padding:16px}}

.inv-wrap{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:980px){.inv-wrap{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:auto 1fr 62px 118px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.line.off .pname,.line.off .qty,.line.off .price{opacity:.35;pointer-events:none}
.line .chk{width:19px;height:19px;accent-color:var(--yellow);cursor:pointer}
.line .pname{font-weight:600;font-size:14px}
.line .name-inp{width:100%;background:transparent;border:1px dashed transparent;border-radius:6px;padding:5px 8px;font-weight:600}
.line .name-inp:hover,.line .name-inp:focus{border-color:var(--line);background:var(--bg)}
.line .qty,.line .price{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:center;font-size:13.5px}
.line .qty:focus,.line .price:focus{border-color:var(--yellow);outline:none}
.stock-hint{font-size:11px;color:var(--muted);display:block}
.stock-hint.low{color:var(--orange)}
.cat-h{font-size:12.5px;font-weight:800;color:var(--yellow);margin:14px 0 2px;padding-inline-start:2px;letter-spacing:.3px}
.cat-h:first-child{margin-top:0}
.inv-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.inv-card-head h2{margin-bottom:0;flex:1 1 280px;min-width:220px}
.inv-search-wrap{position:relative;flex:0 1 290px;min-width:220px}
.inv-search-wrap:before{content:'⌕';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:21px;line-height:1;color:var(--muted);pointer-events:none}
.inv-search{width:100%;padding:9px 38px 9px 12px!important}
.line.search-hidden{display:none!important}
@media(max-width:560px){.inv-search-wrap{flex:1 1 100%;min-width:0;width:100%}.inv-card-head h2{flex-basis:100%;min-width:0}}
.tot-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px}
.tot-row .v{font-weight:800}
.tot-row.grand{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:17px}
.tot-row.grand .v{color:var(--yellow);font-size:20px}
.radio-pay{display:flex;gap:8px;flex-wrap:wrap}
.radio-pay label{flex:1;min-width:88px;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.2s}
.radio-pay input{display:none}
.radio-pay label:has(input:checked){border-color:var(--yellow);color:var(--yellow);background:rgba(255,196,0,.07)}

.pur-line{display:grid;grid-template-columns:120px 1.4fr 58px 110px 46px 110px 90px 34px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.pur-line .inp{padding:8px 6px;font-size:13px}
.pur-brand-wrap{position:relative;min-width:0}
.pur-line .pl-brand{width:100%}
.pur-brand-options{z-index:120;max-height:230px}
.pur-brand-options button{white-space:normal}
.pur-brand-option{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line-soft);padding:2px 5px}
.pur-brand-option .pur-opt-select{flex:1;text-align:right;background:transparent;border:0;color:var(--text);padding:8px 7px;cursor:pointer}
.pur-brand-option .pur-opt-delete{flex:0 0 28px;width:28px;height:28px;border:1px solid rgba(239,88,88,.35);border-radius:7px;background:rgba(239,88,88,.08);color:var(--red);font-weight:900;cursor:pointer;padding:0}
.archive-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.archive-tabs .btn{flex:1 1 180px}
.return-line{display:grid;grid-template-columns:1.6fr .7fr .8fr .8fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
@media(max-width:650px){.return-line{grid-template-columns:1fr 1fr}.return-line .ret-name{grid-column:1/-1}}
.pur-brand-options .brand-empty{padding:10px 12px;font-size:12px;line-height:1.6}
.pur-line .pl-sum{font-size:12.5px;font-weight:700;text-align:center;color:var(--yellow)}
@media(max-width:820px){
  .pur-line{grid-template-columns:1fr 1fr;row-gap:6px}
  .pur-line .pl-cat,.pur-line .pur-brand-wrap{grid-column:span 2}
  .pur-line .pl-sum{text-align:right}
}
#purGrand{font-size:16px;font-weight:800;color:var(--yellow)}

#modalRoot{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
#modalRoot.on{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:100%;max-width:520px;animation:pop .25s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
.modal-head h3{font-size:15.5px;font-weight:800}
.modal-head button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line-soft);flex-wrap:wrap}
#toastRoot{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--surface-2);border:1px solid var(--yellow);color:var(--text);border-radius:var(--pill);padding:10px 22px;font-size:13.5px;font-weight:600;animation:pop .25s ease;max-width:90vw;text-align:center}
.toast.err{border-color:var(--red)}

#printArea{display:none;background:#fff;color:#111}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;inset:0;padding:18px 10px;background:#fff}
  @page{margin:12mm}
}
.pi-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:14px}
.pi-head .shop{font-weight:800;font-size:19px}
.pi-head .shop small{display:block;font-weight:500;font-size:11.5px;color:#444;margin-top:2px}
.pi-title{font-weight:800;font-size:16px;text-align:center;border:2px solid #111;border-radius:30px;padding:4px 22px;align-self:center}

  *,*::before,*::after{animation:none!important;transition:none!important}

function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var f=parseFloat(v);return isNaN(f)?0:f}
function fmt(n){return groupDigits(String(Math.round(num(n))))}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysDiff(iso){var a=new Date(iso+'T00:00:00'),b=new Date(todayStr()+'T00:00:00');return Math.round((a-b)/864e5)}
function normDigits(s){
  return String(s==null?'':s)
    .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
    .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
    .replace(/[،,٬]/g,'');
}
function groupDigits(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function inputNum(v){var t=normDigits(v).replace(/\D/g,'');return t?parseInt(t,10):0}
var _Y=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'];
var _D=['','ده','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'];
var _S=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'];
var _SC=['','هزار','میلیون','میلیارد','هزار میلیارد','میلیون میلیارد'];
function _three(n){
  var parts=[],s=Math.floor(n/100),r=n%100;
  if(s)parts.push(_S[s]);
  if(r){if(r<20)parts.push(_Y[r]);else{var d=Math.floor(r/10),y=r%10;parts.push(_D[d]+(y?' و '+_Y[y]:''))}}
  return parts.join(' و ');
}
function num2fa(n){
  n=Math.round(+n||0);
  if(n===0)return 'صفر';
  if(n<0)return 'منفی '+num2fa(-n);
  var groups=[],x=n;
  while(x>0){groups.push(x%1000);x=Math.floor(x/1000)}
  var out=[];
  for(var i=groups.length-1;i>=0;i--){
    if(!groups[i])continue;
    out.push(_three(groups[i])+(_SC[i]?' '+_SC[i]:''));
  }
  return out.join(' و ');
}

/* ---------- تقویم شمسی ---------- */
function jDiv(a,b){return ~~(a/b)}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump=0,march,n,i;
  for(i=1;i<breaks.length;i+=1){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+jDiv(jump,33)*8+jDiv(jump%33,4);jp=jm}
  n=jy-jp;
  leapJ=leapJ+jDiv(n,33)*8+jDiv((n%33)+3,4);
  if(jump%33===4&&jump-n===4)leapJ+=1;
  var leapG=jDiv(gy,4)-jDiv((jDiv(gy,100)+1)*3,4)-150;
  march=20+leapJ-leapG;
  if(jump-n<6)n=n-jump+jDiv(jump+4,33)*33;
  var leap=((n%33)+4)%33;
  if(leap===-1)leap=4;
  return{leap:leap,gy:gy,march:march};
}
function g2d(gy,gm,gd){
  var d=jDiv((gy+jDiv(gm-8,6)+100100)*1461,4)+jDiv(153*((gm+9)%12)+2,5)+gd-34840408;
  d=d-jDiv(jDiv(gy+100100+jDiv(gm-8,6),100)*3,4)+752;
  return d;
}
function d2g(jdn){
  var j=4*jdn+139361631;
  j=j+jDiv(jDiv(4*jdn+183187720,146097)*3,4)*4-3908;
  var i=jDiv((j%1461),4)*5+308;
  var gd=jDiv((i%153),5)+1;
  var gm=(jDiv(i,153)%12)+1;
  var gy=jDiv(j,1461)-100100+jDiv(8-gm,6);
  return{gy:gy,gm:gm,gd:gd};
}
function j2d(jy,jm,jd){
  var r=jalCal(jy);
  return g2d(r.gy,3,r.march)+(jm-1)*31-jDiv(jm,7)*(jm-7)+jd-1;
}
function d2j(jdn){
  var gy=d2g(jdn).gy,jy=gy-621;
  var r=jalCal(jy),jdn1f=g2d(gy,3,r.march);
  var k=jdn-jdn1f,jm,jd;
  if(k>=0){if(k<=185){jm=1+jDiv(k,31);jd=(k%31)+1;return{jy:jy,jm:jm,jd:jd}}else k-=186}
  else{jy-=1;k+=179;if(r.leap===1)k+=1}
  jm=7+jDiv(k,30);jd=(k%30)+1;
  return{jy:jy,jm:jm,jd:jd};
}
function toJal(iso){var p=String(iso).split('-');return d2j(g2d(+p[0],+p[1],+p[2]))}
function toIso(jy,jm,jd){var g=d2g(j2d(jy,jm,jd));return g.gy+'-'+String(g.gm).padStart(2,'0')+'-'+String(g.gd).padStart(2,'0')}
function jMonthLen(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;return jalCal(jy).leap===1?30:29}
function addJalMonths(iso,m){
  var j=toJal(iso),mm=j.jm+m,y=j.jy;
  while(mm>12){mm-=12;y++}
  while(mm<1){mm+=12;y--}
  var d=Math.min(j.jd,jMonthLen(y,mm));
  return toIso(y,mm,d);
}
function p2(n){return String(n).padStart(2,'0')}
function faDate(iso){if(!iso)return '—';try{var j=toJal(iso);return j.jy+'/'+p2(j.jm)+'/'+p2(j.jd)}catch(e){return iso}}

function jalSelects(id,iso){
  var j=iso?toJal(iso):toJal(todayStr());
  var cj=toJal(todayStr());
  var years='';
  for(var y=cj.jy+2;y>=cj.jy-8;y--)years+='<option value="'+y+'"'+(y===j.jy?' selected':'')+'>'+y+'<\/option>';
  var months='';

  var days='';

  for(var d=1;d<=dl;d++)days+='<option value="'+d+'"'+(d===j.jd?' selected':'')+'>'+d+'<\/option>';
  return '<div class="jal" id="'+id+'"><select class="inp jy">'+years+'<\/select><select class="inp jm">'+months+'<\/select><select class="inp jd">'+days+'<\/select><button type="button" class="btn btn-ghost btn-sm" data-jal-today="'+id+'">امروز<\/button><\/div>';
}
function jalFixDays(id){

/* ---------- وضعیت داده ---------- */
function guessCat(n){var f=CATS.find(function(c){return n&&n.includes(c)});return f||'سایر'}
var dbLoadFatal=null,dbLoadRaw=null,dbStorageKey=DB_KEY;
function freshDB(){return {pin:'1234',seq:1000,purchaseSeq:1000,batches:[],suppliers:[],cheques:[],customers:[],invoices:[],purchaseInvoices:[],returns:[],payments:[],products:[],expenses:[],scraps:[],supPayments:[],laborPrices:{},purchaseModels:{},settings:{}}}
function loadDB(){
  try{
    var primary=localStorage.getItem(DB_KEY);
    var legacy=localStorage.getItem('shahsavari_db_v1');
    var raw=primary!==null?primary:legacy;
    dbStorageKey=primary!==null?DB_KEY:(legacy!==null?'shahsavari_db_v1':DB_KEY);
    if(raw===null)return freshDB();
    dbLoadRaw=raw;
    if(!raw)throw new Error('فایل داده ذخیره‌شده خالی است');
    var d;
    try{d=JSON.parse(raw)}catch(parseError){throw new Error('ساختار JSON اطلاعات ذخیره‌شده خراب یا ناقص است')}
    if(!d||typeof d!=='object'||Array.isArray(d)||d.pin===undefined)throw new Error('ساختار پایگاه داده معتبر نیست');
    var pin=normDigits(String(d.pin));
    if(!/^\d{4,8}$/.test(pin))throw new Error('رمز ورود ذخیره‌شده معتبر نیست');
    d.pin=pin;
    if(Number(d.schemaVersion)>3)throw new Error('این فایل داده با نسخه جدیدتری ساخته شده است؛ این نسخه نباید آن را بازنویسی کند');
    var listKeys=['batches','suppliers','cheques','customers','invoices','purchaseInvoices','returns','payments','products','expenses','scraps','supPayments'];
    listKeys.forEach(function(k){
      if(d[k]!==undefined&&!Array.isArray(d[k]))throw new Error('ساختار بخش '+k+' معتبر نیست');
      if(d[k]===undefined)d[k]=[];
    });
    if(!Number.isFinite(Number(d.seq))||Number(d.seq)<0)throw new Error('شمارنده شماره فاکتور معتبر نیست؛ بازیابی پشتیبان لازم است');
    d.seq=Math.max(Math.floor(Number(d.seq)),(d.invoices||[]).reduce(function(m,x){return Math.max(m,Math.floor(Number(x&&x.no)||0))},0));
    if(!Array.isArray(d.products)||!d.products.length){
      d.products=[];
      (d.batches||[]).forEach(function(b){
        var name=b&&b.product||'';
        if(name&&!d.products.some(function(p){return p.name===name}))d.products.push({id:uid(),name:name,cat:b.cat||guessCat(name)});
      });
    }
    if(d.laborPrices!==undefined&&(!d.laborPrices||typeof d.laborPrices!=='object'||Array.isArray(d.laborPrices)))throw new Error('ساختار قیمت اجرت معتبر نیست');
    if(d.purchaseModels!==undefined&&(!d.purchaseModels||typeof d.purchaseModels!=='object'||Array.isArray(d.purchaseModels)))throw new Error('ساختار پیشنهادهای محصول معتبر نیست');
    if(d.settings!==undefined&&(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings)))throw new Error('ساختار تنظیمات معتبر نیست');
    d.laborPrices=d.laborPrices||{};
    d.purchaseModels=d.purchaseModels||{};
    d.settings=d.settings||{};
    d.purchaseSeq=Number.isFinite(Number(d.purchaseSeq))?Math.max(Math.floor(Number(d.purchaseSeq)),(d.purchaseInvoices||[]).reduce(function(m,x){return Math.max(m,Math.floor(Number(x&&x.no)||0))},1000)):Math.max(1000,(d.purchaseInvoices||[]).reduce(function(m,x){return Math.max(m,Math.floor(Number(x&&x.no)||0))},0));
    if(!Object.keys(d.purchaseModels).length){
      d.products.forEach(function(p){
        if(!p||!p.name)return;
        var cat=p.cat||guessCat(p.name);
        if(!Array.isArray(d.purchaseModels[cat]))d.purchaseModels[cat]=[];
        if(!d.purchaseModels[cat].some(function(n){return searchKey(n)===searchKey(p.name)}))d.purchaseModels[cat].push(p.name);
      });
      (d.batches||[]).forEach(function(b){
        if(!b||!b.product)return;
        var cat=b.cat||guessCat(b.product);
        if(!Array.isArray(d.purchaseModels[cat]))d.purchaseModels[cat]=[];
        if(!d.purchaseModels[cat].some(function(n){return searchKey(n)===searchKey(b.product)}))d.purchaseModels[cat].push(b.product);
      });
    }
    return d;
  }catch(e){
    dbLoadFatal=e&&e.message?e.message:'خطای ناشناخته در خواندن اطلاعات ذخیره‌شده';
    return freshDB();
  }
}
var DB_SCHEMA_VERSION=3;

var balanceCache=null;

function invalidateCaches(){balanceCache=null}
function storageBytes(value){return new Blob([value]).size}
function saveDB(){
  var committedBefore=lastPersistedDBRaw;
  if(dbLoadFatal){toast('به‌دلیل خطای خواندن اطلاعات، ذخیره‌سازی مسدود است. ابتدا پشتیبان معتبر را بازیابی کنید.',1);return false}
  try{
    if(!committedBefore){
      try{committedBefore=localStorage.getItem(dbStorageKey)}catch(snapshotReadError){}
    }
    db.schemaVersion=DB_SCHEMA_VERSION;
    var json=JSON.stringify(db);
    var bytes=storageBytes(json);
    localStorage.setItem(dbStorageKey,json);
    lastPersistedDBRaw=json;
    if(dbStorageKey===DB_KEY){try{localStorage.removeItem('shahsavari_db_v1')}catch(ignoreLegacyCleanup){}}
    invalidateCaches();
    if(bytes>3800000)toast('حجم داده‌ها به حدود '+(bytes/1048576).toFixed(1)+' مگابایت رسیده؛ از داده‌ها پشتیبان بگیرید و انتقال به دیتابیس اصلی را در اولویت بگذارید.',1);
    return true;
  }catch(e){
    try{if(committedBefore){db=JSON.parse(committedBefore)}}catch(restoreError){}
    invalidateCaches();
    toast('ذخیره‌سازی انجام نشد؛ تغییر ثبت نشد و اطلاعات ذخیره‌شده قبلی حفظ شد. فضای مرورگر و فایل پشتیبان را بررسی کنید.',1);
    return false;
  }
}

function ensureProduct(cat,name){
  if(!name)return;
  var p=db.products.find(function(x){return x.name===name});
  if(!p)db.products.push({id:uid(),name:name,cat:cat||guessCat(name)});

}
function searchKey(value){
  return normDigits(String(value==null?'':value)).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim().toLowerCase();

  var bs=db.batches.filter(function(b){return b.product===name&&b.qtyLeft>0});
  if(!bs.length)bs=db.batches.filter(function(b){return b.product===name});
  if(!bs.length)return null;

function validateInvoiceStock(lines){
  var demand=Object.create(null),available=Object.create(null);
  lines.forEach(function(l){if(l.type==='prod')demand[l.name]=(demand[l.name]||0)+num(l.qty)});
  db.batches.forEach(function(b){if(b&&b.product)available[b.product]=(available[b.product]||0)+Math.max(0,num(b.qtyLeft))});
  var shortages=[];
  Object.keys(demand).forEach(function(name){var have=available[name]||0,need=demand[name];if(need>have+0.000001)shortages.push({name:name,need:need,have:have,short:need-have})});
  return{ok:shortages.length===0,shortages:shortages};
}
function consume(name,qty){
  qty=num(qty);
  if(!Number.isFinite(qty)||qty<=0)return{ok:false,cost:0,alloc:[],short:Math.max(0,qty)};
  var rem=qty,cost=0,alloc=[];
  var bs=db.batches.filter(function(b){return b.product===name&&num(b.qtyLeft)>0})
    .sort(function(a,b){return (a.date+a.id).localeCompare(b.date+b.id)});
  var available=bs.reduce(function(sum,b){return sum+num(b.qtyLeft)},0);
  // Never partially consume: a shortage must leave every batch untouched.
  if(available+0.000001<qty)return{ok:false,cost:0,alloc:[],short:qty-available};
  for(var i=0;i<bs.length;i++){
    if(rem<=0.000001)break;
    var b=bs[i],take=Math.min(num(b.qtyLeft),rem);
    b.qtyLeft=Math.max(0,num(b.qtyLeft)-take);cost+=take*num(b.buyPrice);
    alloc.push({batchId:b.id,qty:take,buyPrice:b.buyPrice,sellPrice:b.sellPrice,cat:b.cat||guessCat(b.product),product:b.product,date:b.date,supplierId:b.supplierId||null});rem-=take;
  }
  return{ok:rem<=0.000001,cost:cost,alloc:alloc,short:Math.max(0,rem)};
}
function todayInvoices(){return db.invoices.filter(function(i){return i.date===todayStr()})}
function expensesSum(from,to){return db.expenses.filter(function(x){return x.date>=from&&x.date<=to}).reduce(function(s,x){return s+x.amount},0)}
function scrapsSum(from,to){return db.scraps.filter(function(x){return x.date>=from&&x.date<=to}).reduce(function(s,x){return s+x.amount},0)}
function invoiceLineNetSales(invoice){
  var items=invoice&&Array.isArray(invoice.items)?invoice.items:[];
  var gross=items.map(function(l){return Math.max(0,num(l.qty)*num(l.unitPrice))});
  var grossTotal=gross.reduce(function(sum,v){return sum+v},0);
  var discount=Math.max(0,Math.min(num(invoice&&invoice.discount),grossTotal));
  var lastPositive=-1;
  for(var i=0;i<gross.length;i++)if(gross[i]>0)lastPositive=i;
  var remaining=discount;
  var shares=gross.map(function(v,index){
    if(v<=0||grossTotal<=0)return 0;
    // Assign the final remainder to the last positive line so all line shares
    // reconcile exactly to the invoice-level discount, including fractional quantities.
    if(index===lastPositive){var finalShare=Math.max(0,Math.min(v,remaining));remaining-=finalShare;return finalShare;}
    var share=Math.max(0,Math.min(v,discount*v/grossTotal));
    remaining-=share;
    return share;
  });
  return items.map(function(line,index){return{line:line,index:index,gross:gross[index],discount:shares[index],netSale:Math.max(0,gross[index]-shares[index])}});
}
function returnTotalsByInvoice(list){
  var map=Object.create(null);
  (list||db.returns||[]).forEach(function(r){
    if(!r.invoiceId)return;
    var x=map[r.invoiceId]||(map[r.invoiceId]={amount:0,cost:0,count:0});
    x.amount+=num(r.amount);x.cost+=num(r.costReturned);x.count++;
  });
  return map;
}
function returnLinePrevious(invoice,item,itemIndex){
  var id=item&&(item.lineId||String(itemIndex)),qty=0,amount=0,cost=0;
  (db.returns||[]).forEach(function(r){
    if(r.invoiceId!==invoice.id)return;
    (r.items||[]).forEach(function(x){
      var match=(x.itemId&&x.itemId===id)||(!x.itemId&&x.itemIndex===itemIndex);
      if(match){qty+=num(x.qty);amount+=num(x.amount);cost+=num(x.costReturned)}
    });
  });
  return{qty:qty,amount:amount,cost:cost};
}

function pressKey(k){
  var dots=$$('#pinDots span');

  else if(k==='✓'){tryPin();return}
  else if(pinBuf.length<4){pinBuf+=k}

  dots.forEach(function(d,i){d.classList.toggle('on',i<pinBuf.length)});
  if(pinBuf.length===4)setTimeout(tryPin,120);

function tryPin(){
  var now=Date.now(), until=Number(sessionStorage.getItem('shahsavari_pin_lock_until')||0);
  if(now<until){
    $('#loginErr').textContent='به‌دلیل تلاش‌های ناموفق، چند لحظه صبر کنید.';
    pinBuf='';$$('#pinDots span').forEach(function(d){d.classList.remove('on')});
    return;
  }
  var fails=Number(sessionStorage.getItem('shahsavari_pin_fails')||0);
  if(pinBuf===db.pin){
    sessionStorage.removeItem('shahsavari_pin_fails');
    sessionStorage.removeItem('shahsavari_pin_lock_until');
    sessionStorage.setItem(AUTH_KEY,'1');showApp();
  }else{
    fails++;
    sessionStorage.setItem('shahsavari_pin_fails',String(fails));
    if(fails>=5){
      sessionStorage.setItem('shahsavari_pin_lock_until',String(now+Math.min(30000*(fails-4),180000)));
    }
    $('#pinDots').classList.add('err');
    $('#loginErr').textContent=fails>=5?'تلاش‌های ناموفق زیاد است؛ موقتاً صبر کنید.':'رمز اشتباه است، دوباره تلاش کنید';
    setTimeout(function(){
      pinBuf='';
      $('#pinDots').classList.remove('err');
      $$('#pinDots span').forEach(function(d){d.classList.remove('on')});
      $('#loginErr').textContent='';
    },900);
  }

}

  var c=customer(i.customerId),name=c?c.name:(i.customerName||'مشتری گذرا');
  return '<tr><td class="num">'+i.no+'<\/td><td>'+esc(name)+'<\/td><td class="num y" style="font-weight:700">'+fmt(i.total)+'<\/td><td>'+payTag(i.payType)+'<\/td><td><button class="btn btn-ghost btn-sm" data-view-inv="'+i.id+'">مشاهده<\/button><\/td><\/tr>';
}
function chequeRow(c){
  var d=daysDiff(c.dueDate);
  var when=d===0?'امروز':(d===1?'فردا':(d<0?Math.abs(d)+' روز گذشته':d+' روز دیگر'));
  return '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px">'
    +'<div><b>'+esc(c.party)+'<\/b> <span class="muted">('+(c.direction==='out'?'چک صادره به فروشنده':'چک دریافتی از مشتری')+')</span><\/div>'
    +'<div><span class="num" style="font-weight:800">'+fmt(c.amount)+'<\/span> تومان — سررسید: <b class="o">'+when+'<\/b> <span class="muted num">('+faDate(c.dueDate)+')<\/span><\/div><\/div>';
}
function alarmHint(due){
  var d=daysDiff(due);
  if(d===0)return '<span class="tag tag-r">امروز<\/span>';
  if(d===1)return '<span class="tag tag-o">فردا<\/span>';
  if(d<0)return '<span class="tag tag-r">گذشته<\/span>';
  return '';
}

/* ================= داشبورد ================= */
function followupDue(){
  var t=todayStr();
  return db.invoices.filter(function(i){return !i.walkIn&&!!i.customerId&&!i.followupDone&&addJalMonths(i.date,3)<=t}).slice(-15);
}
function todayBreakdownHTML(){
  var by={};
  todayInvoices().forEach(function(i){
    invoiceLineNetSales(i).forEach(function(x){var l=x.line,k=l.name;if(!by[k])by[k]={sale:0,cost:0};by[k].sale+=x.netSale;by[k].cost+=l.cost||0;});
  });
  (db.returns||[]).filter(function(r){return r.date===todayStr()}).forEach(function(r){(r.items||[]).forEach(function(x){var k=x.name;if(!by[k])by[k]={sale:0,cost:0};by[k].sale-=x.amount;by[k].cost-=x.costReturned||0;});});
  var rows=Object.keys(by).map(function(k){return [k,by[k]]}).sort(function(a,b){return (b[1].sale-b[1].cost)-(a[1].sale-a[1].cost)});
  var scrapT=scrapsSum(todayStr(),todayStr()),expT=expensesSum(todayStr(),todayStr());
  var sumP=rows.reduce(function(sum,r){return sum+r[1].sale-r[1].cost},0);
  if(!rows.length&&!scrapT&&!expT)return emptyBox('امروز گردشی ثبت نشده');
  var h='<div class="table-wrap"><table><thead><tr><th>شرح</th><th>فروش خالص</th><th>بهای تمام‌شده خالص</th><th>سود</th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td>'+esc(r[0])+'</td><td class="num">'+fmt(r[1].sale)+'</td><td class="num muted">'+(r[1].cost?fmt(r[1].cost):'—')+'</td><td class="num y" style="font-weight:700">'+fmt(r[1].sale-r[1].cost)+'</td></tr>';});
  if(scrapT)h+='<tr><td>فروش ضایعات</td><td class="num">'+fmt(scrapT)+'</td><td class="num muted">—</td><td class="num y" style="font-weight:700">'+fmt(scrapT)+'</td></tr>';
  if(expT)h+='<tr><td>هزینه‌ها</td><td class="num muted">—</td><td class="num">'+fmt(expT)+'</td><td class="num r" style="font-weight:700">'+fmt(-expT)+'</td></tr>';
  var net=sumP+scrapT-expT;
  h+='<tr><td><b>سود خالص امروز</b></td><td></td><td></td><td class="num" style="font-weight:800;color:'+(net>=0?'var(--yellow)':'var(--red)')+'">'+fmt(net)+'</td></tr></tbody></table></div>';
  return h;
}
function renderDashboard(){
  var ti=todayInvoices();
  var dayReturns=(db.returns||[]).filter(function(r){return r.date===todayStr()});
  var retSales=dayReturns.reduce(function(s,r){return s+r.amount},0),retCosts=dayReturns.reduce(function(s,r){return s+(r.costReturned||0)},0);
  var rev=ti.reduce(function(s,i){return s+i.total},0)-retSales;
  var prof=ti.reduce(function(s,i){return s+(i.total-i.cost)},0)-retSales+retCosts;
  var scrapT=scrapsSum(todayStr(),todayStr());
  var expT=expensesSum(todayStr(),todayStr());
  var netProfit=prof+scrapT-expT;
  var soon=db.cheques.filter(function(c){return c.status==='open'&&daysDiff(c.dueDate)<=1});
  var followups=followupDue();
  var b=$('#page-dashboard .page-body');
  var h='<div class="grid g4" style="margin-bottom:16px">'
    +'<div class="stat hl"><div class="lbl">فروش امروز<\/div><div class="val num">'+fmt(rev)+'<\/div><div class="lbl">تومان<\/div>'+wordsLine(rev)+'<\/div>'
    +'<div class="stat"><div class="lbl">سود ناخالص امروز<\/div><div class="val num" style="color:'+(prof>=0?'var(--yellow)':'var(--red)')+'">'+fmt(prof)+'<\/div><div class="lbl">تومان<\/div>'+wordsLine(Math.abs(prof))+'<\/div>'
    +'<div class="stat'+(expT>0?' warn':'')+'"><div class="lbl">هزینه‌های امروز<\/div><div class="val num">'+fmt(expT)+'<\/div><div class="lbl">تومان<\/div>'+wordsLine(expT)+'<\/div>'
    +'<div class="stat hl"><div class="lbl">سود خالص امروز<\/div><div class="val num" style="color:'+(netProfit>=0?'var(--yellow)':'var(--red)')+'">'+fmt(netProfit)+'<\/div><div class="lbl">با ضایعات و هزینه‌ها<\/div>'+wordsLine(Math.abs(netProfit))+'<\/div>'
    +'<\/div>'
    +'<div class="row" style="margin-bottom:16px;gap:10px">'
    +'<button class="btn btn-y" data-go-invoice>+ صدور فاکتور<\/button>'
    +'<button class="btn btn-ghost" data-open-purchase>+ ثبت خرید انبار<\/button>'
    +'<button class="btn btn-ghost" data-open-customer>+ مشتری جدید<\/button>'
    +'<\/div>';
  if(followups.length){
    h+='<div class="card" style="border-color:var(--orange);margin-bottom:16px"><h2 class="o">🔔 مراجعه مجدد مشتریان (۳ ماه از فاکتور گذشته)<\/h2>';
    followups.forEach(function(i){
      var c=customer(i.customerId);
      h+='<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px">'
        +'<div><b>'+esc(c?c.name:'—')+'<\/b> — فاکتور <span class="num">'+i.no+'<\/span> مورخ <span class="num">'+faDate(i.date)+'<\/span><\/div>'
        +'<div style="display:flex;gap:8px"><button class="btn btn-y btn-sm" data-fu-inv="'+i.id+'">فاکتور جدید<\/button>'
        +'<button class="btn btn-ghost btn-sm" data-fu-done="'+i.id+'">پیگیری شد<\/button><\/div><\/div>';
    });
    h+='<\/div>';
  }
  if(soon.length)h+='<div class="card" style="border-color:var(--orange);margin-bottom:16px"><h2 class="o">⏰ چک‌های سررسید نزدیک<\/h2>'+soon.map(chequeRow).join('')+'<\/div>';
  h+='<div class="card" style="margin-bottom:16px"><h2>سود امروز به تفکیک <small>هر محصول / خدمت<\/small><\/h2>'+todayBreakdownHTML()+'<\/div>';
  h+='<div class="card"><h2>آخرین فاکتورها <small>'+faDate(todayStr())+'<\/small><\/h2>'
    +(ti.length?tableWrap('<table><thead><tr><th>شماره<\/th><th>مشتری<\/th><th>مبلغ<\/th><th>نوع<\/th><th><\/th><\/tr><\/thead><tbody>'+ti.slice(-6).reverse().map(invRow).join('')+'<\/tbody><\/table>'):emptyBox('امروز هنوز فاکتوری صادر نشده'))+'<\/div>';
  b.innerHTML=h;
  b.querySelector('[data-go-invoice]').addEventListener('click',function(){go('invoice')});
  b.querySelector('[data-open-purchase]').addEventListener('click',function(){openPurchaseModal()});
  b.querySelector('[data-open-customer]').addEventListener('click',function(){openCustomerModal()});
  b.querySelectorAll('[data-view-inv]').forEach(function(el){el.addEventListener('click',function(){viewInvoice(el.dataset.viewInv)})});
  b.querySelectorAll('[data-fu-done]').forEach(function(el){
    el.addEventListener('click',function(){
      var i=db.invoices.find(function(x){return x.id===el.dataset.fuDone});
      if(i){i.followupDone=true;if(!saveDB())return;renderDashboard();toast('پیگیری ثبت شد ✓')}
    });
  });
  b.querySelectorAll('[data-fu-inv]').forEach(function(el){
    el.addEventListener('click',function(){
      var i=db.invoices.find(function(x){return x.id===el.dataset.fuInv});
      if(i){draft.customerId=i.customerId;go('invoice')}
    });
  });
}

/* ================= انبار ================= */
function renderInventory(){
  var bs=[].concat(db.batches).sort(function(a,b){return (b.date+b.id).localeCompare(a.date+a.id)});
  var inventoryPages=Math.max(1,Math.ceil(bs.length/PAGE_SIZE));if(inventoryPage>inventoryPages)inventoryPage=inventoryPages;
  var shownBatches=bs.slice((inventoryPage-1)*PAGE_SIZE,inventoryPage*PAGE_SIZE);
  var stockValue=bs.reduce(function(s,b){return s+b.qtyLeft*b.buyPrice},0);
  var totals={};
  db.batches.forEach(function(b){totals[b.product]=(totals[b.product]||0)+b.qtyLeft});
  var out=Object.keys(totals).map(function(k){return [k,totals[k]]}).filter(function(x){return x[1]<=LOW_STOCK}).sort(function(a,b){return a[1]-b[1]});
  var h='<div class="grid g3" style="margin-bottom:16px">'
    +'<div class="stat"><div class="lbl">تعداد بچ‌های خرید<\/div><div class="val num">'+bs.length+'<\/div><\/div>'
    +'<div class="stat hl"><div class="lbl">ارزش موجودی انبار<\/div><div class="val num">'+fmt(stockValue)+'<\/div><div class="lbl">تومان<\/div>'+wordsLine(stockValue)+'<\/div>'
    +'<div class="stat'+(out.length?' warn':'')+'"><div class="lbl">اقلام تمام‌شده / رو به اتمام<\/div><div class="val num">'+out.length+'<\/div><div class="lbl">قلم<\/div><\/div>'
    +'<\/div>';
  if(out.length){
    h+='<div class="card" style="border-color:var(--orange);margin-bottom:16px"><h2 class="o">⚠ اقلامی که باید خرید کنید<\/h2><div class="row" style="gap:8px">';
    out.forEach(function(x){
      h+='<span class="tag '+(x[1]<=0?'tag-r':'tag-o')+'" style="font-size:12.5px;padding:5px 12px">'+esc(x[0])+' — '+(x[1]<=0?'تمام شد':fmt(x[1])+' باقی‌مانده')+'<\/span>';
    });
    h+='<\/div><\/div>';
  }
  h+='<div class="row" style="margin-bottom:16px;gap:10px"><button class="btn btn-y" id="addBatch">+ ثبت فاکتور خرید<\/button>'
    +'<span class="muted" style="font-size:13px">در یک فاکتور خرید چند محصول با تعداد و قیمت جداگانه ثبت کنید. هنگام فروش، ابتدا از بچ قدیمی‌تر کم می‌شود؛ قیمت پیش‌فرض فروش از بالاترین قیمت فروشِ بچ‌های دارای موجودی انتخاب می‌شود.<\/span><\/div>';
  h+='<div class="card"><h2>بچ‌های خرید <small>'+bs.length+' بچ — نمایش '+(bs.length?((inventoryPage-1)*PAGE_SIZE+1):0)+' تا '+Math.min(inventoryPage*PAGE_SIZE,bs.length)+'</small></h2>';
  if(bs.length){
    h+='<div class="table-wrap"><table><thead><tr><th>تاریخ<\/th><th>دسته<\/th><th>محصول (برند/مدل)<\/th><th>خرید / مانده<\/th><th>قیمت خرید<\/th><th>قیمت فروش<\/th><th>فروشنده<\/th><th>پرداخت<\/th><th><\/th><\/tr><\/thead><tbody>';
    shownBatches.forEach(function(bt){
      h+='<tr style="'+(bt.qtyLeft<=0?'opacity:.45':'')+'">'
        +'<td class="num">'+faDate(bt.date)+'<\/td>'
        +'<td><span class="tag tag-m">'+esc(bt.cat||guessCat(bt.product))+'<\/span><\/td>'
        +'<td><b>'+esc(bt.product)+'<\/b>'+(bt.note?'<br><small class="muted">'+esc(bt.note)+'<\/small>':'')+'<\/td>'
        +'<td class="num">'+fmt(bt.qty)+' / <b style="color:'+(bt.qtyLeft>0?'var(--yellow)':'var(--red)')+'">'+fmt(bt.qtyLeft)+'<\/b><\/td>'
        +'<td class="num">'+fmt(bt.buyPrice)+'<\/td>'
        +'<td class="num y" style="font-weight:700">'+fmt(bt.sellPrice)+'<\/td>'
        +'<td>'+esc(supplierName(bt.supplierId))+'<\/td>'
        +'<td>'+(bt.payCash?'نقد: <span class="num">'+fmt(bt.payCash)+'<\/span>':'')+' '+(bt.payCheque?'<br>چک: <span class="num">'+fmt(bt.payCheque)+'<\/span>':'')+((!bt.payCash&&!bt.payCheque)?'—':'')+'<\/td>'
        +'<td><button class="btn btn-ghost btn-sm" data-edit-batch="'+bt.id+'">ویرایش<\/button> <button class="btn btn-danger btn-sm" data-del-batch="'+bt.id+'">حذف<\/button><\/td><\/tr>';
    });
    h+='<\/tbody><\/table><\/div>'+pagerHTML(inventoryPage,inventoryPages,'inventory-page');
  }else h+=emptyBox('هنوز خریدی ثبت نشده — اولین فاکتور خرید را ثبت کنید');
  h+='<\/div>';
  $('#page-inventory .page-body').innerHTML=h;
  $('#addBatch').addEventListener('click',function(){openPurchaseModal()});
  $$('#page-inventory [data-inventory-page]').forEach(function(el){el.addEventListener('click',function(){inventoryPage=+el.dataset.inventoryPage;renderInventory()})});
  $$('#page-inventory [data-edit-batch]').forEach(function(el){
    el.addEventListener('click',function(){
      var bt=db.batches.find(function(x){return x.id===el.dataset.editBatch});
      if(bt)openBatchEdit(bt);
    });
  });
  $$('#page-inventory [data-del-batch]').forEach(function(el){
    el.addEventListener('click',function(){
      var bt=db.batches.find(function(x){return x.id===el.dataset.delBatch});
      if(!bt)return;
      var used=Math.max(0,num(bt.qty)-num(bt.qtyLeft));
      var linkedCheque=db.cheques.some(function(c){return c.batchId===bt.id});
      if(bt.isReturn||bt.returnId){toast('این بچ حاصل مرجوعی ثبت‌شده است و حذف مستقیم آن مجاز نیست.',1);return}
      if(used>0){toast('این بچ سابقه فروش دارد و حذف آن ممنوع است. برای اصلاح، باید سند اصلاح موجودی ثبت شود.',1);return}
      if(bt.purchaseInvoiceId||linkedCheque||bt.supplierId||num(bt.payCash)>0||num(bt.payCheque)>0){toast('این بچ به سابقه خرید، فروشنده یا چک متصل است و حذف مستقیم آن مجاز نیست.',1);return}
      confirmBox('این بچ مستقل و بدون سابقه مالی حذف شود؟',function(){
        db.batches=db.batches.filter(function(x){return x.id!==bt.id});
        if(!saveDB())return;renderInventory();toast('بچ حذف شد');
      });
    });
  });
}

/* ---------- فاکتور خرید چندمحصولی ---------- */
function openPurchaseModal(){
  var supOpts=db.suppliers.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'<\/option>'}).join('');
  openModal('ثبت فاکتور خرید (چند محصول)',
    '<div class="row">'
    +'<div class="field"><label>فروشنده<\/label><select class="inp" id="pSup"><option value="">— انتخاب کنید —<\/option>'+supOpts+'<\/select><\/div>'
    +'<div class="field"><label>تاریخ خرید *<\/label>'+jalSelects('pDate',todayStr())+'<\/div>'
    +'<\/div>'
    +'<div class="cat-h">اقلام فاکتور<\/div><div id="purLines">'+purLineHTML()+'<\/div>'
    +'<button type="button" class="btn btn-ghost btn-sm" id="purAdd" style="margin-top:10px">+ افزودن قلم<\/button>'
    +'<div class="tot-row grand"><span>مجموع کل خرید<\/span><span class="v num" id="purGrand">0<\/span><\/div>'
    +'<div class="money-words" id="purGrandW"><\/div>'
    +'<div class="row" style="margin-top:10px">'
    +'<div class="field"><label>پرداخت نقدی (تومان)<\/label>'+moneyField('pCash','')+'<\/div>'
    +'<div class="field"><label>پرداخت با چک (تومان)<\/label>'+moneyField('pChq','')+'<\/div>'
    +'<\/div>'
    +'<div class="field" id="pChqDateWrap" style="display:none"><label>تاریخ سررسید چک *<\/label>'+jalSelects('pChqDate','')+'<\/div>'
    +'<p class="muted" style="font-size:12px">در ستون «٪» درصد سود بدهید (مثلاً 20) تا قیمت فروش خودکار محاسبه شود؛ یا قیمت فروش را دستی وارد کنید. اگر مبلغ خرید را کامل نپردازید، مانده به حساب فروشنده می‌آید و بعداً از کارت او «تسویه» کنید.<\/p>',
    '<button class="btn btn-ghost" data-modal-close>انصراف<\/button><button class="btn btn-y" id="savePurchase">ذخیره فاکتور خرید<\/button>',true);
  purBindBrands();
  $('#purAdd').addEventListener('click',function(){
    $('#purLines').insertAdjacentHTML('beforeend',purLineHTML());
    purGrand();
  });
  $('#pChq').addEventListener('input',function(){
    $('#pChqDateWrap').style.display=moneyVal('pChq')>0?'block':'none';
  });
  $('#savePurchase').addEventListener('click',function(){
    var lines=[];
    $$('#purLines .pur-line').forEach(function(r){
      var cat=r.querySelector('.pl-cat').value;
      var brand=r.querySelector('.pl-brand').value.trim();
      var qty=num(normDigits(r.querySelector('.pl-qty').value));
      var buy=inputNum(r.querySelector('.pl-buy').value);
      var sell=inputNum(r.querySelector('.pl-sell').value);
      if(brand||qty>0||buy>0)lines.push({cat:cat,brand:brand,qty:qty,buy:buy,sell:sell});
    });
    var date=jalGet('pDate');
    if(!lines.length){toast('حداقل یک قلم را کامل کنید',1);return}
    for(var i=0;i<lines.length;i++){
      var l=lines[i];
      if(!l.brand||l.qty<=0||l.buy<=0){toast('برند/مدل، تعداد و قیمت خرید همه اقلام را کامل کنید',1);return}
      if(l.sell<=0){toast('قیمت فروش همه اقلام را وارد کنید (یا درصد بدهید)',1);return}
    }
    var chq=moneyVal('pChq'),cash=moneyVal('pCash');
    var supId=$('#pSup').value;
    if(chq>0&&!supId){toast('برای چک، فروشنده را انتخاب کنید',1);return}
    if(chq>0&&!jalGet('pChqDate')){toast('تاریخ سررسید چک را وارد کنید',1);return}
    var grand=lines.reduce(function(s,l){return s+l.qty*l.buy},0)||1;
    var cashLeft=cash,chqLeft=chq;
    lines.forEach(function(l,i){
      if(i===lines.length-1){l.cash=cashLeft;l.chq=chqLeft}
      else{
        var c=Math.round(cash*(l.qty*l.buy)/grand);l.cash=c;cashLeft-=c;
        var k=Math.round(chq*(l.qty*l.buy)/grand);l.chq=k;chqLeft-=k;
      }
    });
    var purchaseId=uid(),purchaseNo=++db.purchaseSeq,purchaseItems=[];
    lines.forEach(function(l,idx){
      var id=uid();
      rememberPurchaseModel(l.cat,l.brand,false);
      db.batches.push({id:id,cat:l.cat,product:l.brand,qty:l.qty,qtyLeft:l.qty,buyPrice:l.buy,sellPrice:l.sell,date:date,supplierId:supId||null,payCash:l.cash,payCheque:l.chq,note:'',purchaseInvoiceId:purchaseId,purchaseInvoiceNo:purchaseNo});
      purchaseItems.push({batchId:id,cat:l.cat,product:l.brand,qty:l.qty,buyPrice:l.buy,sellPrice:l.sell,total:l.qty*l.buy});
      ensureProduct(l.cat,l.brand);
      if(idx===0&&chq>0){
        db.cheques.push({id:uid(),direction:'out',party:supplierName(supId)||'فروشنده',amount:chq,dueDate:jalGet('pChqDate'),status:'open',batchId:id,purchaseInvoiceId:purchaseId,bank:'',serial:''});
      }
    });
    db.purchaseInvoices.push({id:purchaseId,no:purchaseNo,date:date,supplierId:supId||null,items:purchaseItems,total:lines.reduce(function(t,l){return t+l.qty*l.buy},0),payCash:cash,payCheque:chq,createdAt:new Date().toISOString()});
    if(!saveDB())return;closeModal();renderInventory();
    toast('فاکتور خرید شماره '+purchaseNo+' با '+lines.length+' قلم ثبت شد ✓');
  });
}
function purLineHTML(){
  var catOpts=CATS.map(function(c){return '<option'+(c==='روغن موتور'?' selected':'')+'>'+c+'<\/option>'}).join('');
  return '<div class="pur-line">'

function purBindBrands(){
  var box=$('#purLines');
  box.addEventListener('focusin',function(e){
    var r=e.target.closest('.pur-line');
    if(r&&e.target.classList.contains('pl-brand'))renderPurchaseBrandOptions(r);
  });
  box.addEventListener('focusout',function(e){
    var r=e.target.closest('.pur-line');
    if(!r||!e.target.classList.contains('pl-brand'))return;
    setTimeout(function(){
      var options=r.querySelector('.pur-brand-options');
      if(options&&options.contains(document.activeElement))return;
      rememberPurchaseModel(r.querySelector('.pl-cat').value,e.target.value,true);
      hidePurchaseBrandOptions(r);
    },180);
  });
  box.addEventListener('input',function(e){
    var r=e.target.closest('.pur-line');if(!r)return;
    if(e.target.classList.contains('pl-brand'))renderPurchaseBrandOptions(r);
    var buy=inputNum(r.querySelector('.pl-buy').value);
    var pct=num(normDigits(r.querySelector('.pl-pct').value));
    if(e.target.classList.contains('pl-buy')||e.target.classList.contains('pl-pct')){
      if(pct>0&&buy>0)r.querySelector('.pl-sell').value=groupDigits(String(Math.round(buy*(1+pct/100))));
    }
    var qty=num(normDigits(r.querySelector('.pl-qty').value));
    r.querySelector('.pl-sum').textContent=(qty>0&&buy>0)?fmt(qty*buy):'—';
    purGrand();
  });
  box.addEventListener('click',function(e){
    var del=e.target.closest('[data-brand-delete]');
    if(del){
      var delRow=del.closest('.pur-line'),delCat=delRow.querySelector('.pl-cat').value,delName=del.dataset.brandDelete;
      if(searchKey(delRow.querySelector('.pl-brand').value)===searchKey(delName))delRow.querySelector('.pl-brand').value='';
      if(Array.isArray(db.purchaseModels[delCat]))db.purchaseModels[delCat]=db.purchaseModels[delCat].filter(function(n){return searchKey(n)!==searchKey(delName)});
      if(!saveDB())return;renderPurchaseBrandOptions(delRow);toast('«'+delName+'» از پیشنهادها حذف شد؛ فاکتورهای قبلی و موجودی تغییری نکردند');
      return;
    }
    var option=e.target.closest('[data-brand-option]');
    if(option){
      var row=option.closest('.pur-line'),input=row.querySelector('.pl-brand');
      input.value=option.dataset.brandOption;
      rememberPurchaseModel(row.querySelector('.pl-cat').value,input.value,true);
      hidePurchaseBrandOptions(row);
      return;
    }
    if(e.target.closest('.pl-del')){
      if($$('#purLines .pur-line').length>1)e.target.closest('.pur-line').remove();
      purGrand();
    }
  });
}
function purGrand(){
  var g=0;
  $$('#purLines .pur-line').forEach(function(r){
    var qty=num(normDigits(r.querySelector('.pl-qty').value));
    var buy=inputNum(r.querySelector('.pl-buy').value);
    g+=qty*buy;
  });
  $('#purGrand').textContent=fmt(g);
  var w=$('#purGrandW');
  if(w)w.textContent=g?num2fa(g)+' تومان':'';
}

/* ---------- ویرایش تک‌بچ ---------- */
function syncPurchaseInvoiceBatch(batch){
  if(!batch.purchaseInvoiceId)return true;
  var p=(db.purchaseInvoices||[]).find(function(x){return x.id===batch.purchaseInvoiceId});
  if(!p)return false;
  var item=(p.items||[]).find(function(x){return x.batchId===batch.id});
  if(!item)return false;
  item.cat=batch.cat;item.product=batch.product;item.qty=batch.qty;item.buyPrice=batch.buyPrice;item.sellPrice=batch.sellPrice;item.total=num(batch.qty)*num(batch.buyPrice);
  p.total=(p.items||[]).reduce(function(sum,x){return sum+num(x.total!=null?x.total:num(x.qty)*num(x.buyPrice))},0);
  return true;
}
function openBatchEdit(batch){
  var supOpts=db.suppliers.map(function(s){return '<option value="'+s.id+'"'+(batch.supplierId===s.id?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');

    +'</div><div class="row">'

    +'<div class="field"><label>تاریخ خرید *</label>'+jalSelects('bDate',batch.date)+'</div>'
    +'</div><div class="row">'
    +'<div class="field"><label>قیمت خرید *</label>'+moneyField('bBuy',batch.buyPrice)+'</div>'
    +'<div class="field" style="max-width:90px"><label>٪ سود</label><input class="inp num fa-num" id="bPct" inputmode="decimal" placeholder="20"></div>'
    +'<div class="field"><label>قیمت فروش *</label>'+moneyField('bSell',batch.sellPrice)+'</div>'
    +'</div><div class="field"><label>فروشنده</label><select class="inp" id="bSup"><option value="">— انتخاب کنید —</option>'+supOpts+'</select></div>'
    +'<div class="field"><label>توضیحات</label><input class="inp" id="bNote" value="'+esc(batch.note||'')+'"></div>'
    +'<p class="muted" style="font-size:12.5px">'+rules+'<br>تعداد فروخته‌شده ثبت‌شده: <b class="num">'+fmt(used)+'</b> — موجودی فعلی: <b class="num">'+fmt(batch.qtyLeft)+'</b></p>',
    '<button class="btn btn-ghost" data-modal-close>انصراف</button><button class="btn btn-y" id="saveBatchE">ذخیره</button>');
  if(used>0){$('#bCat').disabled=true;$('#bBrand').disabled=true;$('#bBuy').disabled=true;$('#bSup').disabled=true;$('#bDate').querySelectorAll('select').forEach(function(x){x.disabled=true})}
  else if(linked){$('#bSup').disabled=true;$('#bDate').querySelectorAll('select').forEach(function(x){x.disabled=true})}
  $('#bPct').addEventListener('input',function(){
    var buy=moneyVal('bBuy'),pct=num(normDigits($('#bPct').value));
    if(buy>0&&pct>0)$('#bSell').value=groupDigits(String(Math.round(buy*(1+pct/100))));
  });
  $('#saveBatchE').addEventListener('click',function(){
    var brand=$('#bBrand').value.trim(),cat=$('#bCat').value,qty=num(normDigits($('#bQty').value)),buy=moneyVal('bBuy'),sell=moneyVal('bSell'),date=jalGet('bDate'),supplierId=$('#bSup').value||null;
    if(!brand||!Number.isFinite(qty)||qty<=0||buy<=0||sell<=0||!date){toast('همه فیلدها را کامل کنید',1);return}
    var currentUsed=Math.max(0,num(batch.qty)-num(batch.qtyLeft));
    if(qty+0.000001<currentUsed){toast('تعداد خرید نمی‌تواند از تعداد فروخته‌شده ('+fmt(currentUsed)+') کمتر باشد.',1);return}
    if(currentUsed>0&&(brand!==batch.product||cat!==(batch.cat||guessCat(batch.product)))){toast('تغییر برند یا دسته برای بچ دارای سابقه فروش ممنوع است.',1);return}
    if(currentUsed>0&&Math.abs(buy-num(batch.buyPrice))>0.000001){toast('تغییر قیمت خرید بچ دارای سابقه فروش ممنوع است؛ برای اصلاح، سند اصلاحی لازم است.',1);return}
    if(currentUsed>0&&(date!==batch.date||supplierId!==(batch.supplierId||null))){toast('تغییر تاریخ یا فروشنده بچ دارای سابقه فروش ممنوع است.',1);return}
    if(linked&&(date!==batch.date||supplierId!==(batch.supplierId||null))){toast('تاریخ و فروشنده این قلم باید از سند فاکتور خرید اصلاح شوند؛ ویرایش جداگانه مجاز نیست.',1);return}
    if(num(batch.payCash)+num(batch.payCheque)>qty*buy+0.000001){toast('مبلغ پرداخت‌شده این قلم از مبلغ خرید جدید بیشتر می‌شود؛ تعداد یا قیمت را کاهش ندهید.',1);return}
    var linkedPurchase=null,linkedItem=null;
    if(linked){
      linkedPurchase=(db.purchaseInvoices||[]).find(function(x){return x.id===batch.purchaseInvoiceId});
      linkedItem=linkedPurchase&&(linkedPurchase.items||[]).find(function(x){return x.batchId===batch.id});
      if(!linkedPurchase||!linkedItem){toast('ارتباط این بچ با فاکتور خرید پیدا نشد؛ هیچ تغییری انجام نشد.',1);return}
      var candidateTotal=(linkedPurchase.items||[]).reduce(function(sum,x){return sum+(x.batchId===batch.id?qty*buy:num(x.total!=null?x.total:num(x.qty)*num(x.buyPrice)))},0);
      if(candidateTotal+0.000001<num(linkedPurchase.payCash)+num(linkedPurchase.payCheque)){toast('مجموع فاکتور خرید نمی‌تواند از مبلغ پرداخت‌شده کمتر شود.',1);return}
    }
    var old={cat:batch.cat,product:batch.product,qty:batch.qty,qtyLeft:batch.qtyLeft,buyPrice:batch.buyPrice,sellPrice:batch.sellPrice,date:batch.date,supplierId:batch.supplierId,note:batch.note};
    Object.assign(batch,{cat:cat,product:brand,qty:qty,qtyLeft:Math.max(0,qty-currentUsed),buyPrice:buy,sellPrice:sell,date:date,supplierId:supplierId,note:$('#bNote').value.trim()});
    if(linked&&!syncPurchaseInvoiceBatch(batch)){Object.assign(batch,old);toast('ارتباط این بچ با فاکتور خرید پیدا نشد؛ تغییری ذخیره نشد.',1);return}
    ensureProduct(cat,brand);
    if(!saveDB()){batch=db.batches.find(function(x){return x.id===batch.id})||batch;return}closeModal();renderInventory();toast('بچ و فاکتور خرید مرتبط همگام‌سازی شدند ✓');
  });
}

    list.forEach(function(c){

        +(c.invoiceId||c.supPaymentId||c.batchId||c.purchaseInvoiceId?'<span class="muted" title="این چک به سند حسابداری متصل است؛ از سند مبدأ اصلاح یا حذف شود">متصل به سند</span>':' <button class="btn btn-danger btn-sm" data-chq-del="'+c.id+'">حذف<\/button>')+'<\/td><\/tr>';
    });

    ban.classList.add('on');

function customerResultsHTML(q,page){
  var s=normDigits(q).trim().toLowerCase(),k=searchKey(s);

function openCustomerModal(c){
  var isNew=!c;
  openModal(isNew?'مشتری جدید':'ویرایش مشتری',
    '<div class="field"><label>نام و نام خانوادگی *<\/label><input class="inp" id="cuName" value="'+(c?esc(c.name):'')+'"><\/div>'
    +'<div class="field"><label>شماره تماس<\/label><input class="inp num fa-num" id="cuPhone" value="'+(c?esc(c.phone||''):'')+'"><\/div>'

    '<button class="btn btn-ghost" data-modal-close>انصراف<\/button><button class="btn btn-y" id="saveCust">ذخیره<\/button>');
  $('#saveCust').addEventListener('click',function(){
    var name=$('#cuName').value.trim();
    if(!name){toast('نام را وارد کنید',1);return}
    var data={name:name,phone:$('#cuPhone').value.trim(),plate:plateGet('cuPlate'),car:$('#cuCar').value.trim()};

function filterInvoiceItems(query){
  var q=searchKey(query),found=0;
  $$('#invLines .line').forEach(function(line){
    var name=line.dataset.name||line.dataset.lname||((line.querySelector('.name-inp')||{}).value||'');
    var hay=searchKey(name+' '+(line.dataset.cat||''));
    var match=!q||hay.indexOf(q)>=0;
    line.classList.toggle('search-hidden',!match);
    if(match)found++;
  });
  $$('#invLines .inv-cat-heading').forEach(function(head){
    var node=head.nextElementSibling,hasVisible=false;
    while(node&&!node.classList.contains('inv-cat-heading')){
      if(node.classList.contains('line')&&!node.classList.contains('search-hidden'))hasVisible=true;
      node=node.nextElementSibling;
    }
    head.style.display=hasVisible?'':'none';
  });
  var empty=$('#invSearchEmpty');
  if(empty)empty.style.display=(q&&found===0)?'block':'none';
}

function recalcInv(){
  var gross=0;
  $$('#invLines .line').forEach(function(l){
    if(!l.querySelector('.chk').checked)return;

    var p=inputNum(l.querySelector('.price').value);
    gross+=q*p;
  });
  var pay=Math.max(0,gross-moneyVal('invDisc'));
  $('#tGross').textContent=fmt(gross)+' تومان';
  $('#tPay').textContent=fmt(pay)+' تومان';
}

    });

  var cost=lines.reduce(function(sum,l){return sum+l.cost},0);

/* ================= مرجوعی کالا ================= */
function returnedQtyFor(invoiceId,itemId,itemIndex){
  return (db.returns||[]).reduce(function(total,r){
    if(r.invoiceId!==invoiceId)return total;
    (r.items||[]).forEach(function(x){
      if((x.itemId&&x.itemId===itemId)||(!x.itemId&&x.itemIndex===itemIndex))total+=num(x.qty);
    });
    return total;
  },0);
}
function returnAmountFor(invoice,item,qty,itemIndex){
  var idx=itemIndex==null?(invoice.items||[]).indexOf(item):itemIndex;
  var prev=returnLinePrevious(invoice,item,idx),line=invoiceLineNetSales(invoice)[idx];
  var lineNet=line?line.netSale:Math.max(0,num(item.qty)*num(item.unitPrice));
  var cumulative=Math.min(num(item.qty),prev.qty+num(qty));
  var target=cumulative>=num(item.qty)-0.000001?Math.round(lineNet):Math.round(lineNet*cumulative/Math.max(num(item.qty),0.000001));
  return Math.max(0,target-prev.amount);
}
function returnCostAmountFor(invoice,item,qty,itemIndex){
  var idx=itemIndex==null?(invoice.items||[]).indexOf(item):itemIndex;
  var prev=returnLinePrevious(invoice,item,idx),totalCost=num(item.cost);
  var cumulative=Math.min(num(item.qty),prev.qty+num(qty));
  var target=cumulative>=num(item.qty)-0.000001?Math.round(totalCost):Math.round(totalCost*cumulative/Math.max(num(item.qty),0.000001));
  return Math.max(0,target-prev.cost);
}
function returnsForInvoice(invoiceId){return (db.returns||[]).filter(function(r){return r.invoiceId===invoiceId})}
function returnCostPerUnit(item){
  var allocations=Array.isArray(item.alloc)?item.alloc:[];
  var qty=allocations.reduce(function(sum,a){return sum+num(a.qty)},0);
  var cost=allocations.reduce(function(sum,a){return sum+num(a.qty)*(num(a.buyPrice)||0)},0);
  if(qty>0)return cost/qty;
  return item.qty>0?(item.cost||0)/item.qty:0;
}

function saveReturn(){
  var invoiceId=$('#retInvoiceSelect').value,i=db.invoices.find(function(x){return x.id===invoiceId});
  if(!i){toast('فاکتور فروش را انتخاب کنید',1);return}
  var returned=[],amount=0,costReturned=0,invalid=false;
  $$('#returnLineFields .ret-qty').forEach(function(inp){
    var q=num(inp.value);if(q<=0)return;
    var idx=+inp.dataset.retIndex,l=i.items[idx],itemId=l&&(l.lineId||String(idx));
    if(!l||l.type!=='prod')return;
    var already=returnedQtyFor(i.id,itemId,idx),remaining=Math.max(0,l.qty-already);
    if(q>remaining+0.000001){toast('تعداد مرجوعی '+l.name+' از تعداد باقی‌مانده بیشتر است',1);invalid=true;return}
    var value=returnAmountFor(i,l,q,idx),cst=returnCostAmountFor(i,l,q,idx),costPerUnit=returnCostPerUnit(l);
    returned.push({itemId:itemId,itemIndex:idx,name:l.name,type:l.type,qty:q,unitPrice:l.unitPrice,amount:value,costReturned:cst});
    amount+=value;costReturned+=cst;
  });
  if(invalid)return;
  if(!returned.length){toast('تعداد حداقل یک محصول را برای مرجوعی وارد کنید',1);return}

  var settlement=selected?selected.value:'refund';
  if(settlement==='debt'&&(!i.customerId||balanceOf(i.customerId)<=0)){toast('این مشتری بدهی باز ندارد؛ بازپرداخت وجه را انتخاب کنید',1);return}

  var date=todayStr(),customerObj=customer(i.customerId),customerName=customerObj?customerObj.name:(i.customerName||'مشتری گذرا');
  var ret={id:uid(),no:no,date:date,invoiceId:i.id,invoiceNo:i.no,customerId:i.customerId||null,customerName:customerName,items:returned,amount:amount,costReturned:costReturned,settlement:settlement,refundMethod:settlement==='refund'?$('#retRefundMethod').value:null,createdAt:new Date().toISOString()};
  returned.forEach(function(x){
    var original=i.items[x.itemIndex];
    var allocCat=(original.alloc||[]).map(function(a){return a.cat}).filter(Boolean)[0];
    var product=db.products.find(function(p){return p.name===x.name});

    db.batches.push({id:batchId,cat:retCat,product:x.name,qty:x.qty,qtyLeft:x.qty,buyPrice:x.qty>0?Math.max(0,x.costReturned/x.qty):0,sellPrice:x.unitPrice,date:date,supplierId:null,payCash:0,payCheque:0,note:'مرجوعی فاکتور فروش شماره '+i.no,isReturn:true,returnId:ret.id});
    x.returnBatchId=batchId;
  });
  db.returns.push(ret);if(!saveDB())return;activeReturnInvoiceId=i.id;renderReturns();
  toast('مرجوعی شماره '+no+' ثبت شد و '+fmt(returned.reduce(function(sum,x){return sum+x.qty},0))+' عدد به انبار برگشت');

function buildBalanceCache(){
  var m=Object.create(null);
  db.invoices.forEach(function(i){if(i.customerId&&i.payType==='credit')m[i.customerId]=(m[i.customerId]||0)+num(i.total)});
  db.payments.forEach(function(p){if(p.customerId)m[p.customerId]=(m[p.customerId]||0)-num(p.amount)});
  (db.returns||[]).forEach(function(r){if(r.customerId&&r.settlement==='debt')m[r.customerId]=(m[r.customerId]||0)-num(r.amount)});
  balanceCache=m; return m;
}
function balanceOf(cid){if(!balanceCache)buildBalanceCache();return num(balanceCache[cid]||0)}

/* ================= گزارش فروش ================= */
function jalMonthRange(offset){
  var j=toJal(todayStr());
  var m=j.jm+offset,y=j.jy;
  while(m>12){m-=12;y++}
  while(m<1){m+=12;y--}
  var from=toIso(y,m,1);
  var m2=m+1,y2=y;
  if(m2>12){m2=1;y2++}
  var to=toIso(y2,m2,1);
  var td=new Date(to+'T00:00:00');
  td.setDate(td.getDate()-1);
  return {from:from,to:td.getFullYear()+'-'+String(td.getMonth()+1).padStart(2,'0')+'-'+String(td.getDate()).padStart(2,'0')};
}
function renderReport(){
  var iso=todayStr();
  var wD=new Date();wD.setDate(wD.getDate()-6);

    else{fixed={from:'1900-01-01',to:'2099-12-31'};draw()}
  });
  $('#repApply').addEventListener('click',function(){fixed=null;draw()});
  draw();

function reportHTML(from,to){
  var invs=db.invoices.filter(function(i){return i.date>=from&&i.date<=to});
  var returned=(db.returns||[]).filter(function(r){return r.date>=from&&r.date<=to});
  var returnedAmount=returned.reduce(function(s,r){return s+r.amount},0);
  var returnedCost=returned.reduce(function(s,r){return s+(r.costReturned||0)},0);
  var rev=invs.reduce(function(s,i){return s+i.total},0)-returnedAmount;
  var cost=invs.reduce(function(s,i){return s+i.cost},0)-returnedCost;
  var cash=invs.filter(function(i){return i.payType==='cash'}).reduce(function(s,i){return s+i.total},0)-returned.filter(function(r){return r.settlement==='refund'&&r.refundMethod==='cash'}).reduce(function(s,r){return s+r.amount},0);
  var card=invs.filter(function(i){return i.payType==='card'}).reduce(function(s,i){return s+i.total},0)-returned.filter(function(r){return r.settlement==='refund'&&r.refundMethod==='card'}).reduce(function(s,r){return s+r.amount},0);
  var crd=invs.filter(function(i){return i.payType==='credit'}).reduce(function(s,i){return s+i.total},0)-returned.filter(function(r){return r.settlement==='debt'}).reduce(function(s,r){return s+r.amount},0);
  var chq=invs.filter(function(i){return i.payType==='cheque'}).reduce(function(s,i){return s+i.total},0);
  var disc=invs.reduce(function(s,i){return s+(i.discount||0)},0);
  var scrap=scrapsSum(from,to),exp=expensesSum(from,to);
  var profit=rev-cost+scrap-exp;
  var byProd={};
  invs.forEach(function(i){invoiceLineNetSales(i).forEach(function(x){var l=x.line,k=l.name;if(!byProd[k])byProd[k]={qty:0,sale:0,profit:0};byProd[k].qty+=l.qty;byProd[k].sale+=x.netSale;byProd[k].profit+=x.netSale-(l.cost||0);});});
  returned.forEach(function(r){(r.items||[]).forEach(function(x){var k=x.name;if(!byProd[k])byProd[k]={qty:0,sale:0,profit:0};byProd[k].qty-=x.qty;byProd[k].sale-=x.amount;byProd[k].profit-=x.amount-(x.costReturned||0);});});
  var prods=Object.keys(byProd).map(function(k){return [k,byProd[k]]}).sort(function(a,b){return b[1].sale-a[1].sale});
  var h='<p class="muted" style="font-size:13px;margin-bottom:12px">بازه: <b class="num">'+faDate(from)+'</b> تا <b class="num">'+faDate(to)+'</b></p>'
    +'<div class="grid g4">'
    +'<div class="stat hl"><div class="lbl">فروش خالص</div><div class="val num">'+fmt(rev)+'</div><div class="lbl">تومان</div>'+wordsLine(rev)+'</div>'
    +'<div class="stat"><div class="lbl">نقدی خالص</div><div class="val num">'+fmt(cash)+'</div></div>'
    +'<div class="stat"><div class="lbl">کارتخوان خالص</div><div class="val num">'+fmt(card)+'</div></div>'
    +'<div class="stat"><div class="lbl">نسیه خالص</div><div class="val num">'+fmt(crd)+'</div></div></div>'
    +'<div class="grid g4" style="margin-top:12px">'

document.addEventListener('input',function(e){
  var el=e.target;
  if(!el.classList)return;
  if(el.classList.contains('money')){
    var pos=(el.selectionStart!=null)?el.selectionStart:el.value.length;
    var before=normDigits(el.value.slice(0,pos)).replace(/\D/g,'');
    var raw=normDigits(el.value).replace(/\D/g,'').replace(/^0+(?=\d)/,'');
    el.value=raw?groupDigits(raw):'';
    var cnt=0,idx=0;
    while(idx<el.value.length&&cnt<before.length){
      if(/\d/.test(el.value[idx]))cnt++;
      idx++;
    }
    try{el.setSelectionRange(idx,idx)}catch(_){}
    var wid=el.id?el.id+'-w':null;
    var w=wid?document.getElementById(wid):null;
    if(w)w.textContent=raw?num2fa(+raw)+' تومان':'';
  }else if(el.classList.contains('fa-num')){
    var v=normDigits(el.value).replace(/[^\d.]/g,'');
    if(v!==el.value)el.value=v;
  }
  var pl=el.closest?el.closest('.plate'):null;
  if(pl){
    if(el.classList.contains('pa')&&el.value.length>=2)pl.querySelector('.pl').focus();
    if(el.classList.contains('pb')&&el.value.length>=3)pl.querySelector('.pc').focus();
  }
});
document.addEventListener('keydown',function(e){
  if($('#appShell').classList.contains('on'))return;
  if(/^[0-9]$/.test(e.key))pressKey(e.key);
  else if(e.key==='Backspace')pressKey('⌫');
  else if(e.key==='Enter')pressKey('✓');
});
$('#burger').addEventListener('click',openSidebar);
$('#sideClose').addEventListener('click',closeSidebar);
$('#overlay').addEventListener('click',closeSidebar);
setInterval(function(){
  if($('#appShell').classList.contains('on'))checkAlarms();
},3600000);

/* ---------- راه‌اندازی ---------- */
document.addEventListener('DOMContentLoaded',function(){
  try{
    if(dbLoadFatal){showDataRecoveryBlocker();return}
    initLogin();
    $('#headLogo').innerHTML=logoMark();
    if(sessionStorage.getItem(AUTH_KEY)==='1')showApp();
  }catch(e){
    var err=document.getElementById('loginErr');
    if(err)err.textContent='خطای راه‌اندازی: '+e.message;
  }
});
</script>
</body>
</html>
